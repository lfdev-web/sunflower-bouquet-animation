<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>Para Daniela</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Playfair+Display:ital,wght@0,400;1,400&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;min-height:100vh;overflow-x:hidden;}
body{
  font-family:'Cormorant Garamond',serif;
  background:
    radial-gradient(ellipse at 20% 15%, rgba(255,240,190,.20) 0%, transparent 55%),
    radial-gradient(ellipse at 80% 82%, rgba(255,210,140,.15) 0%, transparent 52%),
    linear-gradient(150deg, #fefcf4 0%, #fdf8ea 28%, #faf2d8 58%, #f5e8c2 100%);
  min-height:100vh;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  position:relative;
}
.orb{position:fixed;border-radius:50%;pointer-events:none;z-index:0;}
.o1{width:520px;height:520px;top:-160px;right:-120px;
    background:radial-gradient(circle,rgba(255,235,160,.10)0%,transparent 70%);}
.o2{width:440px;height:440px;bottom:-140px;left:-110px;
    background:radial-gradient(circle,rgba(255,210,140,.08)0%,transparent 70%);}

#pcv{position:fixed;inset:0;pointer-events:none;z-index:1;
     opacity:0;transition:opacity 1.6s ease;}
#pcv.on{opacity:1;}

/* ── LANDING ── */
#landing{
  position:relative;z-index:10;
  display:flex;flex-direction:column;align-items:center;gap:26px;
  transition:opacity .7s ease,transform .7s ease;
}
#landing.out{opacity:0;pointer-events:none;transform:scale(.95);}
.land-pre{font-size:1rem;color:#a07a50;letter-spacing:.2em;font-style:italic;}
#btn{
  font-family:'Playfair Display',serif;font-size:1.22rem;color:#5a3618;
  background:linear-gradient(135deg,#fefaf2,#fdf0ce);
  border:1.5px solid rgba(190,140,60,.38);
  padding:16px 52px;border-radius:60px;cursor:pointer;letter-spacing:.07em;
  box-shadow:0 4px 28px rgba(165,105,15,.16),inset 0 1px 0 rgba(255,255,255,.78);
  transition:all .3s cubic-bezier(.25,.8,.25,1);
}
#btn:hover{transform:translateY(-3px);
  box-shadow:0 9px 40px rgba(165,105,15,.24),inset 0 1px 0 rgba(255,255,255,.88);}
#btn:active{transform:translateY(-1px);}

/* ── SCENE ── */
#scene{
  display:none;flex-direction:column;
  align-items:center;width:100%;
  padding:10px 8px 28px;
  position:relative;z-index:10;
}
#scene.on{display:flex;}

#svgWrap{width:min(400px,92vw); position:relative;}
#bsv{width:100%;height:auto;overflow:visible;
     filter:drop-shadow(0 18px 48px rgba(100,55,4,.18));}

/* Glow ring — sits behind SVG, only animates opacity = GPU composited, zero repaint */
#glowRing{
  position:absolute;
  top:50%; left:50%;
  width:88%; height:55%;
  transform:translate(-50%, -38%);
  border-radius:50%;
  background:radial-gradient(ellipse, rgba(255,240,190,.65) 0%, rgba(255,220,150,.22) 45%, transparent 72%);
  opacity:0;
  pointer-events:none;
  z-index:-1;
  /* transition for the initial fade-in */
  transition:opacity 1s ease;
}
#glowRing.pulse{
  animation:glowPulse 2s ease-in-out infinite;
}
@keyframes glowPulse{
  0%,100%{opacity:.55;}
  50%{opacity:.85;}
}

/* whole bouquet gentle sway from grip */
#bouquet{transform-origin:220px 500px;will-change:transform;}
#svgWrap.sway #bouquet{animation:sway 7s ease-in-out infinite;}
@keyframes sway{
  0%,100%{transform:rotate(0deg);}
  32%{transform:rotate(.9deg);}
  68%{transform:rotate(-.8deg);}
}
#pcv{will-change:transform;}

/* ── MOBILE PERFORMANCE ──
   SVG filter="url(#sf)" on animated groups forces CPU rasterization every frame.
   Strip everything that causes per-frame repaint on mobile.
*/
@media(max-width:768px){
  #bsv{filter:none !important;}          /* kills the outer drop-shadow */
  body{background:linear-gradient(150deg,#fefcf4 0%,#faf2d8 55%,#f5e8c2 100%);}
  .orb{display:none;}                    /* fewer compositor layers */
  #pcv{will-change:auto;}               /* let browser decide on mobile */
}

/* ── MESSAGE ── */
#msg{
  margin-top:22px;text-align:center;
  max-width:min(440px,92vw);
  opacity:0;transform:translateY(18px);
  transition:opacity 1.4s ease,transform 1.4s ease;
  padding:0 18px;
}
#msg.on{opacity:1;transform:translateY(0);}
.mname{
  font-family:'Playfair Display',serif;
  font-size:clamp(2rem,7vw,2.5rem);
  color:#5a3c18;letter-spacing:.08em;margin-bottom:14px;
  font-weight:400;
}
.mdiv{
  width:60px;height:1px;margin:0 auto 18px;
  background:linear-gradient(90deg,transparent,rgba(165,105,20,.5),transparent);
}
.mbody{
  font-size:clamp(1.05rem,4vw,1.15rem);
  color:#6e5030;line-height:2.1;
  font-weight:300;letter-spacing:.022em;
}
@media(max-width:400px){
  .mname{font-size:2rem;}
  .mbody{font-size:1rem;line-height:1.95;}
  #msg{padding:0 14px;}
}

/* ── SINGLE BUTTON ── */
#btns{
  display:flex;justify-content:center;
  margin-top:28px;
  opacity:0;transform:translateY(12px);
  transition:opacity 1s ease,transform 1s ease;
}
#btns.on{opacity:1;transform:translateY(0);}
.rbtn{
  font-family:'Cormorant Garamond',serif;
  font-size:clamp(1rem,4vw,1.1rem);
  letter-spacing:.08em;
  padding:13px 36px;border-radius:50px;
  border:1px solid rgba(160,120,60,.32);
  cursor:pointer;transition:all .3s cubic-bezier(.25,.8,.25,1);
  background:linear-gradient(135deg,#fefcf4,#fdf6e0);
  color:#5a3c18;
  box-shadow:0 2px 14px rgba(150,100,20,.10),inset 0 1px 0 rgba(255,255,255,.7);
}
.rbtn:hover{transform:translateY(-2px);
  box-shadow:0 6px 24px rgba(150,100,20,.16),inset 0 1px 0 rgba(255,255,255,.82);}
.rbtn:active{transform:translateY(0);}

/* ── REPLY MESSAGE ── */
#reply{
  margin-top:16px;min-height:32px;
  text-align:center;
  font-size:clamp(.95rem,3.8vw,1.08rem);
  font-style:italic;color:#8a5e2a;
  opacity:0;transform:translateY(8px);
  transition:opacity .6s ease,transform .6s ease;
  padding:0 18px;
}
#reply.on{opacity:1;transform:translateY(0);}
</style>
</head>
<body>
<div class="orb o1"></div>
<div class="orb o2"></div>
<canvas id="pcv"></canvas>

<div id="landing">
  <p class="land-pre">algo para ti</p>
  <button id="btn" onclick="start()">Ver</button>
</div>

<div id="scene">
  <div id="svgWrap">
  <div id="glowRing"></div>
  <!--
    ViewBox: 0 0 440 560
    Bouquet grip centre: (220, 490)
    Ribbon/wrap: y 460–510
    Stems fan up from (220,470):
      F0 centre:    (220,  88)  — tallest, disc r=50
      F1 left:      (150, 118)  — disc r=44
      F2 right:     (290, 112)  — disc r=44
      F3 far-left:  ( 80, 165)  — disc r=38
      F4 far-right: (360, 155)  — disc r=38
    Leaves sit at mid-stem heights
  -->
  <svg id="bsv" viewBox="0 0 440 560" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="stG" x1="0%"   y1="0%" x2="100%" y2="0%">
        <stop offset="0%"  stop-color="#245018"/><stop offset="48%" stop-color="#4a8a3c"/><stop offset="100%" stop-color="#2c5e22"/>
      </linearGradient>
      <linearGradient id="lfL" x1="0%"   y1="0%" x2="100%" y2="100%">
        <stop offset="0%"  stop-color="#6ac455"/><stop offset="100%" stop-color="#255018"/>
      </linearGradient>
      <linearGradient id="lfR" x1="100%" y1="0%" x2="0%"   y2="100%">
        <stop offset="0%"  stop-color="#6ac455"/><stop offset="100%" stop-color="#255018"/>
      </linearGradient>
      <linearGradient id="pA" x1="50%" y1="0%" x2="50%" y2="100%">
        <stop offset="0%"  stop-color="#ffe55a"/><stop offset="50%" stop-color="#f5bc28"/><stop offset="100%" stop-color="#bf7c06"/>
      </linearGradient>
      <linearGradient id="pB" x1="28%" y1="0%" x2="72%" y2="100%">
        <stop offset="0%"  stop-color="#ffd636"/><stop offset="58%" stop-color="#e8a016"/><stop offset="100%" stop-color="#ae6804"/>
      </linearGradient>
      <linearGradient id="pC" x1="72%" y1="0%" x2="28%" y2="100%">
        <stop offset="0%"  stop-color="#ffe870"/><stop offset="100%" stop-color="#ca8a0c"/>
      </linearGradient>
      <radialGradient id="dG" cx="44%" cy="36%" r="58%">
        <stop offset="0%"  stop-color="#9c6a20"/><stop offset="55%" stop-color="#5a3010"/><stop offset="100%" stop-color="#321606"/>
      </radialGradient>
      <radialGradient id="dRim" cx="50%" cy="50%" r="50%">
        <stop offset="70%" stop-color="transparent"/><stop offset="100%" stop-color="rgba(0,0,0,.22)"/>
      </radialGradient>
      <radialGradient id="sdG" cx="36%" cy="30%" r="64%">
        <stop offset="0%"  stop-color="#ca8030"/><stop offset="100%" stop-color="#401c06"/>
      </radialGradient>
      <!-- wrap paper gradient -->
      <linearGradient id="wpG" x1="10%" y1="0%" x2="90%" y2="100%">
        <stop offset="0%"  stop-color="#fefcf4"/><stop offset="100%" stop-color="#f0e2b8"/>
      </linearGradient>
      <linearGradient id="wpS" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%"  stop-color="rgba(210,180,90,.18)"/><stop offset="100%" stop-color="rgba(180,140,60,.28)"/>
      </linearGradient>
      <!-- ribbon — soft blush/dusty rose to differentiate -->
      <linearGradient id="rbG" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%"  stop-color="#d4a0a8"/>
        <stop offset="100%" stop-color="#a86070"/>
      </linearGradient>
      <filter id="sf" x="-15%" y="-15%" width="130%" height="130%">
        <feDropShadow dx="0" dy="2" stdDeviation="2.8" flood-color="rgba(50,20,0,.18)"/>
      </filter>
      <filter id="sfS" x="-8%" y="-8%" width="116%" height="116%">
        <feDropShadow dx="0" dy="1.5" stdDeviation="1.8" flood-color="rgba(50,20,0,.14)"/>
      </filter>
      <!-- clip paths -->
      <clipPath id="dc0"><circle cx="220" cy="84" r="57"/></clipPath>
      <clipPath id="dc1"><circle cx="150" cy="118" r="47"/></clipPath>
      <clipPath id="dc2"><circle cx="290" cy="112" r="47"/></clipPath>
    </defs>

    <!-- whole bouquet in one group for unified sway -->
    <g id="bouquet">

      <!-- ══ STEMS ══ (drawn first, behind everything) -->
      <!-- F0 centre — straight up -->
      <path id="st0" class="stm"
        d="M222,472 C221,440 220,380 220,310 C220,240 220,170 220,138"
        fill="none" stroke="url(#stG)" stroke-width="9" stroke-linecap="round" filter="url(#sf)"/>
      <!-- F1 left -->
      <path id="st1" class="stm"
        d="M218,474 C214,448 205,398 190,340 C176,284 162,228 150,162"
        fill="none" stroke="url(#stG)" stroke-width="9" stroke-linecap="round" filter="url(#sf)"/>
      <!-- F2 right -->
      <path id="st2" class="stm"
        d="M222,474 C226,448 235,398 250,340 C264,284 278,228 290,156"
        fill="none" stroke="url(#stG)" stroke-width="9" stroke-linecap="round" filter="url(#sf)"/>

      <!-- Leaf: F1 left stem, points left  y≈305 -->
      <g id="lf0" opacity="0">
        <path d="M0,0 C-6,-9 -26,-20 -46,-15 C-66,-10 -68,6 -54,13 C-40,18 -10,7 0,0Z"
          fill="url(#lfL)" filter="url(#sfS)"/>
        <path d="M0,0 C-18,-7 -40,-7 -52,3" stroke="#255018" stroke-width=".8" fill="none" opacity=".4"/>
      </g>
      <!-- Leaf: F2 right stem, points right  y≈298 -->
      <g id="lf1" opacity="0">
        <path d="M0,0 C6,-9 26,-20 46,-15 C66,-10 68,6 54,13 C40,18 10,7 0,0Z"
          fill="url(#lfR)" filter="url(#sfS)"/>
        <path d="M0,0 C18,-7 40,-7 52,3" stroke="#255018" stroke-width=".8" fill="none" opacity=".4"/>
      </g>
      <!-- Leaf: F0 centre stem left  y≈335 -->
      <g id="lf2" opacity="0">
        <path d="M0,0 C-5,-8 -24,-18 -42,-14 C-60,-9 -62,6 -48,12 C-34,16 -8,6 0,0Z"
          fill="url(#lfL)" filter="url(#sfS)"/>
      </g>
      <!-- Leaf: F0 centre stem right  y≈335 -->
      <g id="lf3" opacity="0">
        <path d="M0,0 C5,-8 24,-18 42,-14 C60,-9 62,6 48,12 C34,16 8,6 0,0Z"
          fill="url(#lfR)" filter="url(#sfS)"/>
      </g>

      <!-- ══ FLOWERS  back→front z-order: F1, F2, F0 ══ -->

      <!-- F1 left  cx=150,cy=118,dr=46 -->
      <g id="fg1"><g id="pig1"></g><g id="pog1"></g>
        <g id="cg1" opacity="0">
          <circle cx="150" cy="120" r="50" fill="rgba(0,0,0,.08)"/>
          <circle cx="150" cy="118" r="48" fill="url(#dG)"/>
          <circle cx="150" cy="118" r="48" fill="url(#dRim)"/>
          <g clip-path="url(#dc1)"><g id="ssg1"></g></g>
        </g>
      </g>

      <!-- F2 right  cx=290,cy=112,dr=46 -->
      <g id="fg2"><g id="pig2"></g><g id="pog2"></g>
        <g id="cg2" opacity="0">
          <circle cx="290" cy="114" r="50" fill="rgba(0,0,0,.08)"/>
          <circle cx="290" cy="112" r="48" fill="url(#dG)"/>
          <circle cx="290" cy="112" r="48" fill="url(#dRim)"/>
          <g clip-path="url(#dc2)"><g id="ssg2"></g></g>
        </g>
      </g>

      <!-- F0 centre  cx=220,cy=84 — main flower, larger -->
      <g id="fg0"><g id="pig0"></g><g id="pog0"></g>
        <g id="cg0" opacity="0">
          <circle cx="220" cy="86" r="60" fill="rgba(0,0,0,.09)"/>
          <circle cx="220" cy="84" r="58" fill="url(#dG)"/>
          <circle cx="220" cy="84" r="58" fill="url(#dRim)"/>
          <g clip-path="url(#dc0)"><g id="ssg0"></g></g>
          <ellipse cx="206" cy="70" rx="20" ry="12" fill="rgba(255,215,130,.07)" transform="rotate(-22,206,70)"/>
        </g>
      </g>

      <!-- ══ WRAP PAPER + RIBBON  (on top of stems, behind flowers) ══ -->
      <g id="wrap" opacity="0">
        <!-- paper body — elegant tapered cone shape -->
        <path d="M170,512 L192,450 Q220,440 248,450 L270,512 Q220,524 170,512Z"
          fill="url(#wpG)" filter="url(#sf)"/>
        <!-- paper left crease -->
        <path d="M192,450 L178,512" stroke="rgba(190,160,70,.2)" stroke-width="1.2" fill="none"/>
        <!-- paper right crease -->
        <path d="M248,450 L262,512" stroke="rgba(190,160,70,.2)" stroke-width="1.2" fill="none"/>
        <!-- paper top fold line -->
        <path d="M190,452 Q220,444 250,452" stroke="rgba(190,160,70,.25)" stroke-width="1" fill="none"/>
        <!-- ribbon band -->
        <rect x="194" y="446" width="52" height="11" rx="3" fill="url(#rbG)" filter="url(#sfS)"/>
        <!-- bow left loop -->
        <path d="M220,450 C210,436 190,432 185,440 C180,448 194,456 220,452Z"
          fill="#c89098" opacity=".9"/>
        <!-- bow right loop -->
        <path d="M220,450 C230,436 250,432 255,440 C260,448 246,456 220,452Z"
          fill="#b07888" opacity=".9"/>
        <!-- bow knot -->
        <ellipse cx="220" cy="451" rx="7" ry="5.5" fill="#9a6070"/>
        <!-- ribbon tails -->
        <path d="M215,454 C208,464 202,470 196,478" stroke="#a86878" stroke-width="3.5" fill="none" stroke-linecap="round"/>
        <path d="M225,454 C232,464 238,470 244,478" stroke="#b07080" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      </g>

    </g><!-- end #bouquet -->
  </svg>
  </div>

  <div id="msg">
    <div class="mname">Daniela</div>
    <div class="mdiv"></div>
    <p class="mbody">
      Oye…<br><br>
      ya te había mandado flores antes<br>
      pero ahora sí van con la fecha correcta… como debe ser<br><br>
      Igual, más allá de la fecha, el detalle siempre fue para ti<br>
      solo porque sí…<br><br>
      así que ahora sí… oficialmente son tuyas
    </p>
  </div>

  <div id="btns">
    <button class="rbtn" onclick="onButton()">Se ve mejor así, ¿no?</button>
  </div>
  <p id="reply"></p>
</div>

<script>
const NS = 'http://www.w3.org/2000/svg';
const sleep = ms => new Promise(r => setTimeout(r, ms));

/* ═══ MOBILE PERFORMANCE DETECTION ═══ */
const isMobile = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent) || innerWidth < 768;
const MAX_PARTS  = isMobile ? 10 : 50;   // drastically fewer on mobile
const SEED_SCALE = isMobile ? 0.35 : 1;  // 65% fewer SVG seed nodes on mobile

/* Strip every SVG filter attribute on mobile.
   Each filter="url(#sf)" on an animated parent = full CPU rasterisation per frame. */
function stripFilters(){
  if(!isMobile) return;
  document.querySelectorAll('[filter]').forEach(el=>el.removeAttribute('filter'));
}

/* ═══ FLOWER DATA — 3 flowers, centre is the main one ═══ */
const FLOWERS = [
  { id:0, cx:220, cy: 84, dr:58, oLen:96, iLen:76, pW:32, oN:24, iN:16, seeds:240 }, // centre — bigger
  { id:1, cx:150, cy:118, dr:46, oLen:80, iLen:64, pW:26, oN:20, iN:13, seeds:175 }, // left
  { id:2, cx:290, cy:112, dr:46, oLen:80, iLen:64, pW:26, oN:20, iN:13, seeds:175 }, // right
];

/* ═══ LEAF DATA ═══ */
const LEAVES = [
  { id:'lf0', ax:186, ay:308 },  // F1 left stem
  { id:'lf1', ax:254, ay:302 },  // F2 right stem
  { id:'lf2', ax:218, ay:338 },  // F0 centre left
  { id:'lf3', ax:222, ay:338 },  // F0 centre right
];

/* ═══ PARTICLES ═══ */
const pcv = document.getElementById('pcv'), pc = pcv.getContext('2d');
let parts = [];
// Cap pixel ratio at 1.5 — retina at full ratio kills mobile GPUs
const DPR = Math.min(window.devicePixelRatio || 1, 1.5);
function rsz(){
  pcv.width  = innerWidth  * DPR;
  pcv.height = innerHeight * DPR;
  pcv.style.width  = innerWidth  + 'px';
  pcv.style.height = innerHeight + 'px';
  pc.scale(DPR, DPR);
}
rsz(); addEventListener('resize', rsz);
function mkp(){
  const t = ['petal','petal','petal','spark','circle'][Math.floor(Math.random()*5)];
  const h = Math.random()*18+40;  // narrower range: warm gold 40-58, less orange
  // Pre-bake color strings once so drawParts never builds strings per frame
  const c0 = `hsla(${h+12},100%,74%,1)`;
  const c1 = `hsla(${h},95%,60%,1)`;
  const c2 = `hsla(${h-10},90%,45%,.7)`;
  return{
    x: Math.random()*innerWidth,
    y: -20 - Math.random()*80,
    sz: Math.random()*7+4,
    vy: Math.random()*.65+.22,
    vx: (Math.random()-.5)*.5,
    // pre-compute a random phase offset so we avoid Date.now() per particle
    phase: Math.random()*Math.PI*2,
    op: Math.random()*.6+.25,
    rot: Math.random()*Math.PI*2,
    rs: (Math.random()-.5)*.022,
    h, c0, c1, c2,
    life:1, decay: Math.random()*.0014+.0003, t
  };
}
let _t = 0;
let _lastFrame = 0;
const _targetMs = isMobile ? 50 : 16; // ~20fps mobile, ~60fps desktop
function drawParts(ts){
  requestAnimationFrame(drawParts);
  if(ts - _lastFrame < _targetMs) return; // throttle
  _lastFrame = ts;
  _t += 0.016;
  pc.clearRect(0,0,innerWidth,innerHeight);
  if(parts.length < MAX_PARTS_current) parts.push(mkp());
  parts = parts.filter(p=>{
    // use pre-baked phase offset instead of Date.now() per particle
    p.x += p.vx + Math.sin(_t*.6 + p.phase)*.28;
    p.y += p.vy; p.rot += p.rs; p.life -= p.decay;
    if(p.life<=0 || p.y > innerHeight+30) return false;
    pc.globalAlpha = p.op * p.life;
    if(p.t==='petal'){
      const w=p.sz*.38, h=p.sz*1.1;
      pc.save(); pc.translate(p.x,p.y); pc.rotate(p.rot);
      // create gradient once using pre-baked color strings
      const g = pc.createLinearGradient(0,-h,0,h*.3);
      g.addColorStop(0,   p.c0);
      g.addColorStop(0.5, p.c1);
      g.addColorStop(1,   p.c2);
      pc.fillStyle = g;
      pc.beginPath();
      pc.ellipse(0,-h*.35,w,h,0,0,Math.PI*2);
      pc.fill();
      if(!isMobile){ // skip vein stroke on mobile — saves ~30% canvas time
        pc.strokeStyle=`hsla(${p.h-8},80%,38%,.28)`;
        pc.lineWidth=.6;
        pc.beginPath(); pc.moveTo(0,h*.4); pc.lineTo(0,-h*.9); pc.stroke();
      }
      pc.restore();
    } else if(p.t==='spark'){
      pc.fillStyle=`hsla(${p.h+22},100%,80%,1)`;
      if(isMobile){
        // simple circle on mobile instead of 4-triangle star
        pc.beginPath(); pc.arc(p.x,p.y,p.sz*.5,0,Math.PI*2); pc.fill();
      } else {
        pc.save(); pc.translate(p.x,p.y); pc.rotate(p.rot);
        const s=p.sz*.48;
        for(let a=0;a<4;a++){ pc.rotate(Math.PI/2); pc.beginPath();
          pc.moveTo(0,0); pc.lineTo(s*.28,s*.28); pc.lineTo(0,s*1.15);
          pc.lineTo(-s*.28,s*.28); pc.closePath(); pc.fill(); }
        pc.restore();
      }
    } else {
      pc.fillStyle=`hsla(${p.h},88%,74%,1)`;
      pc.beginPath(); pc.arc(p.x,p.y,p.sz*.48,0,Math.PI*2); pc.fill();
    }
    return true;
  });
  pc.globalAlpha=1;
}

/* ═══ EASING ═══ */
function easeOutBack(t){ const c1=1.70158,c3=c1+1; return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2); }
function easeInOut(t){ return t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2; }
function tween(ms,cb,ease){
  return new Promise(res=>{
    let s=null;
    function step(ts){ if(!s)s=ts; const t=Math.min((ts-s)/ms,1); cb(ease?ease(t):t); t<1?requestAnimationFrame(step):res(); }
    requestAnimationFrame(step);
  });
}

/* ═══ PETAL PATH ═══ */
function petalD(len,w){ const h=w/2,c1=len*.32,c2=len*.66;
  return `M0,0 C${h*.58},${-c1} ${h},${-c2} 0,${-len} C${-h},${-c2} ${-h*.58},${-c1} 0,0Z`; }

/* ═══ BUILD FLOWER ═══ */
const flowerPetals = {};
function buildFlower(f){
  const {id,cx,cy,dr,oLen,iLen,pW,oN,iN} = f;
  const grads=['pA','pB','pC'];
  const list=[];

  // outer
  const og=document.getElementById('pog'+id);
  for(let i=0;i<oN;i++){
    const ang=(i/oN)*360, rad=ang*Math.PI/180;
    const bx=cx+(dr+1)*Math.sin(rad), by=cy-(dr+1)*Math.cos(rad);
    const len=oLen+(Math.random()*7-3.5), w=pW+(Math.random()*4-2);
    const g=document.createElementNS(NS,'g');
    g.setAttribute('transform',`translate(${bx},${by}) rotate(${ang}) scale(0)`);
    g.style.opacity='0';
    const p=document.createElementNS(NS,'path');
    p.setAttribute('d',petalD(len,w)); p.setAttribute('fill',`url(#${grads[i%3]})`);
    if(!isMobile) p.setAttribute('filter','url(#sf)'); // skip heavy drop-shadow on mobile
    const v=document.createElementNS(NS,'path');
    v.setAttribute('d',`M0,0 L0,${-len*.68}`); v.setAttribute('stroke','rgba(148,88,0,.16)'); v.setAttribute('stroke-width','.8'); v.setAttribute('fill','none');
    g.appendChild(p); g.appendChild(v); og.appendChild(g);
    list.push({el:g,bx,by,ang,ring:'outer'});
  }
  // inner
  const ig=document.getElementById('pig'+id);
  for(let i=0;i<iN;i++){
    const ang=(i/iN)*360+(360/(iN*2)), rad=ang*Math.PI/180;
    const bx=cx+(dr-9)*Math.sin(rad), by=cy-(dr-9)*Math.cos(rad);
    const g=document.createElementNS(NS,'g');
    g.setAttribute('transform',`translate(${bx},${by}) rotate(${ang}) scale(0)`);
    g.style.opacity='0';
    const p=document.createElementNS(NS,'path');
    p.setAttribute('d',petalD(iLen,pW-7)); p.setAttribute('fill','url(#pB)'); p.setAttribute('opacity','.82');
    g.appendChild(p); ig.appendChild(g);
    list.push({el:g,bx,by,ang,ring:'inner'});
  }
  flowerPetals[id]=list;

  // seeds — reduce count on mobile to cut DOM nodes
  const sg=document.getElementById('ssg'+id);
  const ga=137.508*Math.PI/180, N=Math.round(f.seeds*SEED_SCALE), maxR=dr-5;
  for(let i=0;i<N;i++){
    const t=i/N, r=Math.sqrt(t)*maxR, th=i*ga;
    const x=cx+r*Math.cos(th), y=cy+r*Math.sin(th), sz=1.8+(1-t)*1.5;
    const e=document.createElementNS(NS,'ellipse');
    e.setAttribute('cx',x); e.setAttribute('cy',y);
    e.setAttribute('rx',sz*.55); e.setAttribute('ry',sz*.78);
    e.setAttribute('transform',`rotate(${th*180/Math.PI+90},${x},${y})`);
    e.setAttribute('fill','url(#sdG)'); e.style.opacity='0';
    sg.appendChild(e);
  }
}

/* ═══ REVEAL SEEDS ═══ */
async function revealSeeds(id){
  const seeds=[...document.querySelectorAll(`#ssg${id} ellipse`)];
  for(let i=0;i<seeds.length;i++){
    seeds[i].style.transition='opacity .055s ease'; seeds[i].style.opacity='1';
    if(i%6===0) await sleep(2);
  }
  await sleep(260);
}

/* ═══ REVEAL PETALS ═══ */
async function revealPetals(id){
  const list=flowerPetals[id];
  const inner=list.filter(p=>p.ring==='inner');
  const outer=list.filter(p=>p.ring==='outer');
  inner.forEach((p,i)=>{ const d=i*58;
    setTimeout(()=>{ p.el.style.opacity='1';
      tween(600,t=>{ const s=easeOutBack(t);
        p.el.setAttribute('transform',`translate(${p.bx},${p.by}) rotate(${p.ang}) scale(${s})`);
      });},d);});
  await sleep(inner.length*58+220);
  outer.forEach((p,i)=>{ const d=i*62;
    setTimeout(()=>{ p.el.style.opacity='1';
      tween(650,t=>{ const s=easeOutBack(t);
        p.el.setAttribute('transform',`translate(${p.bx},${p.by}) rotate(${p.ang}) scale(${s})`);
      });},d);});
  await sleep(outer.length*62+450);
}

/* ═══ STEM ANIMATION ═══ */
function animStem(el, delay){
  return sleep(delay).then(()=>{
    const len=el.getTotalLength();
    el.style.strokeDasharray=len; el.style.strokeDashoffset=len;
    return tween(1200,t=>{ el.style.strokeDashoffset=len*(1-easeInOut(t)); });
  });
}

/* ═══ LEAF ═══ */
function setLeaf(id,ax,ay,s){ document.getElementById(id).setAttribute('transform',`translate(${ax},${ay}) scale(${s})`); }
function animLeaf(id,ax,ay,delay){
  return sleep(delay).then(()=>{
    document.getElementById(id).style.opacity='1';
    return tween(660,t=>setLeaf(id,ax,ay,easeOutBack(t)));
  });
}

/* ═══ BUTTON INTERACTION ═══ */
let MAX_PARTS_current = MAX_PARTS;
let _btnUsed = false;

function onButton(){
  if(_btnUsed) return;
  _btnUsed = true;

  // Slightly more particles — gentle, not a flood
  MAX_PARTS_current = isMobile ? 20 : 65;

  // Glow ring — GPU composited opacity only
  document.getElementById('glowRing').classList.add('pulse');

  // Desktop: add filter glow too
  if(!isMobile){
    const wrap = document.getElementById('svgWrap');
    wrap.style.transition = 'filter 1.4s ease';
    wrap.style.filter = 'drop-shadow(0 0 22px rgba(255,215,80,.42)) drop-shadow(0 18px 48px rgba(100,55,4,.14))';
  }

  // Soft scale breathe on bouquet
  const bq = document.getElementById('bouquet');
  bq.style.transition = 'transform .5s cubic-bezier(.34,1.4,.64,1)';
  bq.style.transform  = 'scale(1.04)';
  setTimeout(()=>{ bq.style.transform='scale(1)'; bq.style.transition='transform .4s ease'; }, 520);

  // Reply — calm, no emoji
  showReply('sabía que sí');

  // Fade button out
  const btns = document.getElementById('btns');
  btns.style.transition = 'opacity .5s ease';
  btns.style.opacity = '0';
  btns.style.pointerEvents = 'none';
}

function showReply(text){
  const r = document.getElementById('reply');
  r.classList.remove('on');
  void r.offsetWidth;
  r.textContent = text;
  r.classList.add('on');
}

async function start(){
  document.getElementById('landing').classList.add('out');
  await sleep(650);
  document.getElementById('scene').classList.add('on');

  // build all
  FLOWERS.forEach(f=>buildFlower(f));
  LEAVES.forEach(l=>setLeaf(l.id,l.ax,l.ay,0));

  // CRITICAL: remove all SVG filter attributes on mobile before animation starts
  stripFilters();

  await sleep(80);

  /* 1 — stems grow, more stagger for calm feeling */
  const stEls=[...document.querySelectorAll('.stm')];
  await Promise.all(stEls.map((s,i)=>animStem(s,i*140)));
  await sleep(180);

  /* 2 — leaves — slower */
  await Promise.all(LEAVES.map((l,i)=>animLeaf(l.id,l.ax,l.ay,i*130)));
  await sleep(280);

  /* 3 — wrap + ribbon */
  const wrap=document.getElementById('wrap');
  wrap.style.opacity='0'; wrap.style.transition='opacity .9s ease';
  wrap.style.opacity='1';
  await sleep(750);

  /* 4 — flowers back→front: left, right, then centre last */
  const order=[1,2,0];
  for(let i=0;i<order.length;i++){
    const f=FLOWERS.find(x=>x.id===order[i]);
    const cg=document.getElementById('cg'+f.id);
    cg.style.transition='opacity .9s ease'; cg.style.opacity='1';
    await sleep(i===2 ? 600 : 420); // extra pause before centre flower
    await revealSeeds(f.id);
    await revealPetals(f.id);
    if(i<2) await sleep(200);
  }

  /* 5 — sway (desktop only — on mobile the whole bouquet repaints every frame) */
  if(!isMobile) document.getElementById('svgWrap').classList.add('sway');

  /* 6 — particles */
  pcv.classList.add('on'); requestAnimationFrame(drawParts);

  /* 7 — message then button */
  await sleep(900);
  document.getElementById('msg').classList.add('on');
  await sleep(1600);
  document.getElementById('btns').classList.add('on');
}
</script>
